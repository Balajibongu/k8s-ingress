apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-ingress
  labels:
    name: Alb
    env: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      name: Alb
      env: dev
  template:
    metadata:
      labels:
        name: Alb
        env: dev
    spec:
      containers:
      - name: app1
        image: balaji1729/app1:v1
---
apiVersion: v1
kind: Service
metadata:
  name: service 
spec:
  selector:
      name: Alb
      env: dev
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minimal-ingress
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:832510228841:certificate/0e1dd116-2183-40f7-9a64-e902b03402dc
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/tags: Environment=dev,Project=roboshop
    alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/group.name: roboshop
spec:
  ingressClassName: alb
  rules:
  - host: "app1.bongu.online"
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: service
            port:
              number: 80
